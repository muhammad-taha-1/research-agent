services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: researchagent
      POSTGRES_PASSWORD: researchagent
      POSTGRES_DB: researchagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
